name: CI Pipeline

on:
  push:
    branches: ["main", "develop", "member1", "member2", "member3", "feature/*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # FRONTEND (root)
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Run linter
        run: npm run lint 2>&1 || true

      - name: Build frontend
        run: npm run build

      # BACKEND (server folder)
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Test backend (optional)
        working-directory: server
        run: npm test --if-present 2>&1 || true