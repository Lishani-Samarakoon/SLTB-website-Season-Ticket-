name: CI Pipeline

on:
  push:
    branches: ["main", "member1", "member2", "member3", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # FRONTEND (root)
      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # BACKEND (server folder)
      - name: Install backend
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm test --if-present
