name: CI Pipeline

on:
  push:
    branches: ["main", "member1", "member2", "member3", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
docker-frontend
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

          node-version: 18
          cache: 'npm'

      # FRONTEND (root)
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Run linter
        run: npm run lint 2>&1 || true
        main

      - name: Build frontend
        run: npm run build

docker-frontend
  backend:
    name: Backend Install Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend deps
        working-directory: server
        run: npm ci

      # BACKEND (server folder)
      - name: Install backend dependencies
        run: cd server && npm ci --legacy-peer-deps --no-audit || npm install --legacy-peer-deps --no-audit

      - name: Test backend (optional)
        run: cd server && npm test --if-present 2>&1 || true
main
