name: CI Pipeline

on:
  push:
    branches: ["main", "member1", "member2", "member3", "feature/*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install frontend
      - name: Install frontend
        working-directory: SLTB-Season-Ticket
        run: npm install

      - name: Build frontend
        working-directory: SLTB-Season-Ticket
        run: npm run build --if-present

      # Install backend
      - name: Install backend
        working-directory: SLTB-Season-Ticket/server
        run: npm install
