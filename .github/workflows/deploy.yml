name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
HEAD
  build-and-deploy:

  build:
develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

HEAD
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

=======
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit 2>&1 || npm install --legacy-peer-deps

      - name: Build project
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://sltb-backend.vercel.app' }}
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          env: VITE_API_URL=${{ secrets.VITE_API_URL || 'https://sltb-backend.vercel.app' }}
develop
